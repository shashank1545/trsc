name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install clang-format==22.1.5
      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' '*.c' | xargs clang-format --dry-run --Werror

  build:
    name: build and test (LLVM 23)
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 23 toolchain
        run: |
          sudo env \
            TRSC_STATIC_LLVM=1 \
            TRSC_STATIC_LLVM_PREFIX=/opt/llvm-23-static \
            TRSC_INSTALL_TEST_DEPS=1 \
            bash ci/install-llvm23.sh
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-llvm23-${{ runner.os }}-v1
          restore-keys: |
            ccache-llvm23-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=ON \
            -DMLIR_DIR=/usr/lib/llvm-23/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm \
            -DTRSC_LLVM_STATIC_ARCHIVE=/opt/llvm-23-static/lib/libLLVM23-all.a \
            -DTRSC_MLIR_STATIC_ARCHIVE=/opt/llvm-23-static/lib/libMLIR23-all.a \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
      - name: Build
        run: cmake --build build
      - name: Verify static LLVM linkage
        run: |
          set -euo pipefail
          BIN=build/tools/trsc/trsc
          deps=$(ldd "$BIN")
          printf '%s\n' "$deps"
          if grep -q 'not found' <<<"$deps"; then
            echo "ERROR: trsc has unresolved dynamic dependencies" >&2
            exit 1
          fi
          if grep -Eq 'libLLVM|libMLIR|libz3|libstdc\+\+|libgcc_s' <<<"$deps"; then
            echo "ERROR: trsc has a shared LLVM/MLIR or C++ runtime dependency" >&2
            exit 1
          fi
      - name: Test non-GPU suite
        run: ctest --test-dir build --output-on-failure -j4 -LE GPU
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llvm23-last-test-log
          path: build/Testing/Temporary/LastTest.log

  tidy:
    name: clang-tidy 
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: pipx install clang-tidy==22.1.7
      - name: Run clang-tidy
        run: |
          git ls-files '*.cpp' '*.c' \
            | xargs -n1 -P2 -I{} clang-tidy --quiet {} -- -std=c++17 -Iinclude
