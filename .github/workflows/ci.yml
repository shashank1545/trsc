name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to match the local toolchain (clang-format 22.x).
      - name: Install clang-format
        run: pipx install clang-format==22.1.5
      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

  build:
    name: build and test (LLVM 23)
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 23 toolchain
        run: sudo bash ci/install-llvm23.sh
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-llvm23-${{ runner.os }}-v1
          restore-keys: |
            ccache-llvm23-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=ON \
            -DMLIR_DIR=/usr/lib/llvm-23/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23
      - name: Build
        run: cmake --build build
      - name: Test non-GPU suite
        run: ctest --test-dir build --output-on-failure -j4 -LE GPU
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llvm23-last-test-log
          path: build/Testing/Temporary/LastTest.log

  tidy:
    name: clang-tidy (frontend)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: pipx install clang-tidy==22.1.7
      # Scope: the LLVM-free frontend (Lex/Parse/Sema/AST/Basic) only.
      # The MLIR mid-end compiles against a local LLVM 23 (git) tree that
      # CI cannot install from packages; it is checked in local builds.
      # Check selection and WarningsAsErrors come from .clang-tidy.
      - name: Run clang-tidy
        run: |
          git ls-files 'lib/Lex/*.cpp' 'lib/Parse/*.cpp' 'lib/Sema/*.cpp' \
                       'lib/AST/*.cpp' 'lib/Basic/*.cpp' \
            | xargs -n1 -P2 -I{} clang-tidy --quiet {} -- -std=c++17 -Iinclude
