FROM ubuntu:24.04

ENV DEBIAN_FRONTEND=noninteractive
ENV CC=clang-23
ENV CXX=clang++-23
ENV LD_LIBRARY_PATH=/usr/lib/llvm-23/lib

WORKDIR /src

COPY ci/install-llvm23.sh /tmp/install-llvm23.sh
RUN bash /tmp/install-llvm23.sh \
      && rm -f /tmp/install-llvm23.sh \
      && rm -rf /var/lib/apt/lists/*

RUN ln -s /usr/bin/clang-23 /usr/bin/clang \
      && ln -s /usr/bin/clang++-23 /usr/bin/clang++

COPY . .
